// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.0.0'
group = 'com.example.teleportportals'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'teleport_portals'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'teleport_portals', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

// The GLFW that ships with LWJGL 3.4 has both a Wayland and an X11 backend and picks Wayland on
// Wayland sessions, but Minecraft's GLFW init is not Wayland-compatible yet: Forge's early window
// calls glfwGetWindowPos, which Wayland reports as GLFW_FEATURE_UNAVAILABLE (0x1000C), and that
// error is still pending when the real window is created, so startup dies with
// "GLFW error before init: Wayland: The platform does not provide the window position".
// GLFW selects the X11 backend (XWayland) when XDG_SESSION_TYPE is not "wayland".
// Note: this has to be set on the run task, not in the runs{} block, which only adds variables.
if (System.getenv('DISPLAY') != null) {
    tasks.withType(JavaExec).configureEach {
        environment 'XDG_SESSION_TYPE', 'x11'
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.0.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}
